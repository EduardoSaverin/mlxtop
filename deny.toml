[licenses]
confidence-threshold = 0.8
unused-allowed-license = "allow"
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSL-1.0",
  "MIT",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

# Build-only dependencies of the macOS libproc wrapper. License texts are
# reviewed and included in the release notices bundle.
[[licenses.exceptions]]
name = "bindgen"
version = "=0.72.1"
allow = ["BSD-3-Clause"]

[[licenses.exceptions]]
name = "libloading"
version = "=0.8.9"
allow = ["ISC"]

[sources]
unknown-git = "deny"
unknown-registry = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
